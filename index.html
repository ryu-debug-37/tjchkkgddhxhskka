<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catatan Lucu Buat Kamu</title>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root{
    --pink1:#f06a9b; --pink2:#c2417a; --paper:#f7fbf4; --ink:#4a2a3a; --accent:#c2417a;
    --bg:#f6e6ee; --dot:#e9c4d4;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Patrick Hand','Comic Sans MS','Chalkboard SE',cursive;
    background:var(--bg);
    background-image:radial-gradient(var(--dot) 1.5px,transparent 1.5px);
    background-size:22px 22px;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;color:var(--ink);
  }
  .scene{perspective:1600px;width:100%;display:flex;justify-content:center}

  /* spiral */
  .spiral{
    background:repeating-linear-gradient(to bottom,#c2417a 0 14px,#fff 14px 24px);
    border-radius:3px;
  }

  /* COVER */
  .cover{
    position:relative;width:min(300px,78vw);aspect-ratio:3/4.2;
    background:linear-gradient(135deg,var(--pink1),var(--pink2));
    border-radius:6px 14px 14px 6px;
    box-shadow:0 14px 35px rgba(194,65,122,.45);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#fff;text-align:center;cursor:pointer;padding:20px 20px 20px 34px;
    transform-origin:left center;transition:transform .35s;
  }
  .cover:hover{transform:rotateY(-6deg)}
  .cover .spiral{position:absolute;left:0;top:10px;bottom:10px;width:14px}
  .cat{width:110px;height:100px;margin-bottom:16px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.2))}
  .cover h1{font-size:1.5rem;font-weight:400;line-height:1.2}
  .cover p{font-size:.85rem;opacity:.9;margin-top:10px}
  .tag{
    position:absolute;right:12px;bottom:12px;background:#fff;color:var(--accent);
    font-size:.72rem;padding:4px 10px;border-radius:8px;
  }

  /* BOOK */
  .book{
    display:none;position:relative;width:min(760px,94vw);height:min(440px,62vh);
    background:var(--paper);border-radius:10px;
    box-shadow:0 18px 40px rgba(194,65,122,.35);
    cursor:pointer;transform-origin:center;
  }
  .book.show{display:flex;animation:open .5s ease}
  .book .spiral{position:absolute;left:50%;top:0;bottom:0;width:20px;margin-left:-10px;z-index:3}
  .page{flex:1;padding:22px 34px;display:flex;flex-direction:column;position:relative}
  .page h2{
    font-size:1.35rem;font-weight:400;color:var(--accent);text-align:center;
    padding-bottom:6px;margin-bottom:auto;border-bottom:2px dashed #d9c3cc;
  }
  .page .txt{margin:auto 0;font-size:1rem;line-height:1.7}
  .page .txt p+p{margin-top:14px}
  .page.l{padding-right:36px}
  .page.r{padding-left:36px}
  .deco{display:flex;justify-content:space-around;font-size:1.4rem;margin-top:auto}
  .hint{position:absolute;right:16px;bottom:8px;font-size:.7rem;color:var(--accent)}
  .strong{color:var(--accent)}

  /* last right page = back cover */
  .page.back{
    background:linear-gradient(135deg,var(--pink1),var(--pink2));
    border-radius:0 10px 10px 0;margin:10px 10px 10px 0;
    color:#fff;align-items:center;text-align:center;
  }
  .page.back h2{color:#fff;border:none;margin:0 0 4px}
  .page.back .sub{font-size:.8rem;opacity:.9}
  .close{margin:auto;font-size:1.3rem}

  .flip{animation:flip .45s ease}
  @keyframes flip{
    0%{transform:rotateY(0)} 50%{transform:rotateY(-14deg) scale(.97);opacity:.6}
    100%{transform:rotateY(0)}
  }
  @keyframes open{from{opacity:0;transform:scale(.8) rotateY(25deg)}to{opacity:1;transform:none}}

  .pop{position:fixed;pointer-events:none;font-size:1.4rem;animation:up 1.2s ease-out forwards}
  @keyframes up{to{transform:translateY(-90px);opacity:0}}

  /* hiasan halaman */
  .page{isolation:isolate}
  .page:not(.back){
    background-image:repeating-linear-gradient(to bottom,transparent 0 29px,#f4dce6 29px 30px);
    background-position:0 14px;
  }
  .page:not(.back)::before{
    content:"";position:absolute;top:-7px;left:50%;width:74px;height:20px;margin-left:-37px;
    background:repeating-linear-gradient(45deg,rgba(240,106,155,.45) 0 6px,rgba(255,255,255,.55) 6px 12px);
    transform:rotate(-3deg);border-radius:2px;z-index:2;
  }
  .corner{position:absolute;top:22px;font-size:1.4rem;z-index:2;transform:rotate(12deg)}
  .page.l .corner{left:14px;transform:rotate(-12deg)}
  .page.r .corner{right:14px}
  .wm{
    position:absolute;left:50%;top:52%;transform:translate(-50%,-50%) rotate(-8deg);
    font-size:7.5rem;opacity:.09;z-index:-1;pointer-events:none;user-select:none;
  }
  .page.back .wm{opacity:.18}
  .page.back .corner{top:14px}
  .sparkle{position:absolute;font-size:.9rem;opacity:.7;z-index:1;pointer-events:none;animation:tw 2.4s ease-in-out infinite}
  @keyframes tw{0%,100%{transform:scale(.8);opacity:.35}50%{transform:scale(1.2);opacity:.95}}

  /* navigasi */
  .nav{
    position:fixed;left:50%;transform:translateX(-50%);
    bottom:max(14px,env(safe-area-inset-bottom));
    display:none;align-items:center;gap:14px;background:#fff;
    padding:6px 10px;border-radius:999px;box-shadow:0 6px 18px rgba(194,65,122,.3);z-index:10;
  }
  .nav.show{display:flex}
  .nav button{
    width:38px;height:38px;border:0;border-radius:50%;cursor:pointer;
    background:linear-gradient(135deg,var(--pink1),var(--pink2));color:#fff;
    font-size:1.1rem;font-family:inherit;line-height:1;
  }
  .nav button:active{transform:scale(.9)}
  .nav span{font-size:.95rem;color:var(--accent);min-width:44px;text-align:center}

  /* ===== foto background ===== */
  .page .bg{
    position:absolute;top:0;left:0;right:0;bottom:0;z-index:-2;pointer-events:none;
    overflow:hidden;background:#f6e6ee;
  }
  .page .bg img{width:100%;height:100%;object-fit:cover;object-position:center 18%;display:block}
  .page .bg::after{
    content:"";position:absolute;top:0;left:0;right:0;bottom:0;
    background:linear-gradient(rgba(255,248,251,.30),rgba(255,248,251,.55));
  }
  .page.back .bg::after{background:linear-gradient(rgba(240,106,155,.50),rgba(194,65,122,.82))}
  .page.l .bg{border-radius:10px 0 0 10px}
  .page.r .bg{border-radius:0 10px 10px 0}
  .page .wm{display:none}
  .page h2{
    align-self:center;margin-bottom:0;border-bottom:0;
    background:rgba(255,252,250,.88);padding:5px 18px;border-radius:999px;
    box-shadow:0 2px 8px rgba(194,65,122,.18);
  }
  .page.back h2{background:none;box-shadow:none;color:#fff;text-shadow:0 2px 6px rgba(120,20,70,.55)}
  .page .txt{
    margin:auto 0 10px;padding:14px 16px;border-radius:16px;
    background:rgba(255,252,250,.88);
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
    box-shadow:0 4px 14px rgba(120,40,80,.18);
  }
  .page .txt,.page .deco,.page h2{position:relative;z-index:2}
  .page .deco{
    margin-top:0;align-self:center;gap:18px;justify-content:center;
    background:rgba(255,252,250,.82);padding:2px 16px;border-radius:999px;
  }
  .page .hint{background:rgba(255,252,250,.85);padding:1px 8px;border-radius:999px}
  .page.back .sub{text-shadow:0 1px 4px rgba(120,20,70,.6);font-size:.9rem}
  .page.back .close{
    background:rgba(255,255,255,.9);color:var(--accent);padding:8px 18px;border-radius:999px;
    font-size:1.05rem;margin-top:auto;margin-bottom:auto;
  }
  .corner{background:rgba(255,255,255,.75);border-radius:50%;width:34px;height:34px;
    display:flex;align-items:center;justify-content:center;font-size:1.1rem}

  /* sampul pakai foto */
  .cover .cbg{
    position:absolute;top:0;left:0;right:0;bottom:0;border-radius:inherit;z-index:0;
    pointer-events:none;overflow:hidden;
  }
  .cover .cbg img{width:100%;height:100%;object-fit:cover;object-position:center 20%;display:block}
  .cover .cbg::after{
    content:"";position:absolute;top:0;left:0;right:0;bottom:0;
    background:linear-gradient(135deg,rgba(240,106,155,.74),rgba(194,65,122,.9));
  }
  .cover .cat,.cover h1,.cover p{position:relative;z-index:1}
  .cover h1,.cover p{text-shadow:0 2px 6px rgba(120,20,70,.5)}
  .cover .spiral{z-index:2}
  .cover .tag{z-index:2}

  /* HP / layar sempit: 1 halaman per tap, spiral di kiri kayak sampul */
  @media(max-width:640px){
    .book{
      width:min(330px,88vw);
      height:min(560px,74vh);
      height:min(560px,74dvh);
      border-radius:6px 14px 14px 6px;
    }
    .book .spiral{
      left:0;right:auto;top:10px;bottom:10px;
      width:14px;height:auto;margin:0;
      background:repeating-linear-gradient(to bottom,#c2417a 0 14px,#fff 14px 24px);
    }
    #pr{display:none}
    .page{flex:1;min-height:0;padding:22px 22px 18px 38px}
    .page.l{padding:22px 22px 18px 38px}
    .page h2{font-size:1.2rem;margin-bottom:4px}
    .page .txt{font-size:1rem;line-height:1.6}
    .page .txt p+p{margin-top:12px}
    .deco{font-size:1.3rem}
    .hint{right:16px;bottom:6px;font-size:.7rem}
    .page.back{margin:0;border-radius:6px 14px 14px 6px;padding-left:38px}
    .cover{width:min(300px,78vw)}
  }
  @media(max-width:640px) and (max-height:640px){
    .page .txt{font-size:.88rem;line-height:1.45}
    .page h2{font-size:1rem}
  }
  @media(max-width:640px){
    .page.l .bg,.page.r .bg,.page.back .bg{border-radius:6px 14px 14px 6px !important}
    .corner{top:16px;right:12px}
  }
  /* sampul belakang: foto 100% tanpa overlay */
  .page.back .bg{background:none}
  .page.back .bg::after{display:none}
  .page.back .bg img{object-position:center 25%}
  .page.back .bg{border-radius:0 10px 10px 0}
  .page.back h2{
    background:rgba(255,252,250,.9);color:var(--accent);text-shadow:none;
    padding:5px 18px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.2);
  }
  .page.back .sub{
    background:rgba(255,252,250,.9);color:var(--accent);text-shadow:none;
    padding:3px 12px;border-radius:999px;margin-top:8px;font-size:.85rem;
  }
  .page.back .close{box-shadow:0 3px 10px rgba(0,0,0,.25);margin-top:auto;margin-bottom:18px}
  /* semua foto 100% opacity, tanpa overlay */
  .page .bg::after{display:none !important}
  /* judul atas disembunyikan (kecuali sampul belakang) */
  .page:not(.back) h2{display:none}

  /* animasi balik halaman */
  .leaf{
    position:absolute !important;top:0;bottom:0;left:50%;right:0;
    z-index:2;pointer-events:none;transform-origin:left center;
    animation:turn .7s cubic-bezier(.45,.05,.55,.95) forwards;
    box-shadow:-6px 0 18px rgba(120,40,80,.25);
  }
  .leaf-static{
    position:absolute !important;top:0;bottom:0;left:0;right:50%;
    z-index:1;pointer-events:none;animation:fadeout .2s .5s forwards;
  }
  @keyframes turn{
    0%{transform:perspective(1400px) rotateY(0);opacity:1}
    65%{opacity:1}
    100%{transform:perspective(1400px) rotateY(-105deg);opacity:0}
  }
  @keyframes fadeout{to{opacity:0}}
  @media(max-width:640px){
    .leaf{left:0;right:0}
  }
</style>
</head>
<body>
<div class="scene">

  <!-- Sampul -->
  <div class="cover" id="cover">
    <div class="spiral"></div>
    <svg class="cat" viewBox="0 0 110 100">
      <polygon points="14,40 22,4 48,22" fill="#e8f5ee"/>
      <polygon points="96,40 88,4 62,22" fill="#e8f5ee"/>
      <ellipse cx="55" cy="58" rx="46" ry="38" fill="#e8f5ee"/>
      <circle cx="38" cy="56" r="4" fill="#4a2a3a"/>
      <circle cx="72" cy="56" r="4" fill="#4a2a3a"/>
      <ellipse cx="30" cy="66" rx="6" ry="3.5" fill="#f4a9c0"/>
      <ellipse cx="80" cy="66" rx="6" ry="3.5" fill="#f4a9c0"/>
      <path d="M50 66 q5 5 10 0" stroke="#4a2a3a" stroke-width="2" fill="none" stroke-linecap="round"/>
      <circle cx="68" cy="72" r="6" fill="#e0334f"/><circle cx="68" cy="72" r="2" fill="#ffd54a"/>
    </svg>
    <h1>Catatan Lucu Buat Kamu raaa 🐈</h1>
    <p>(Jangan diskip ya wkwk 😝)</p>
    <span class="tag">Klik sampulnya →</span>
  </div>

  <!-- Buku -->
  <div class="book" id="book">
    <div class="spiral"></div>
    <div class="page l" id="pl"></div>
    <div class="page r" id="pr"></div>
  </div>
</div>

  const spreads = [
    {
      l:{t:'Halaman Pembuka 🐾', body:['"Hai kamu! Sengaja bikin buku catatan model begini biar gemesin. Isinya cuma mau bilang makasih ya udah sabar ngadepin aku wkwk.','Yuk lanjut buka halaman berikutnya! 👇"'], deco:['🌸','🐱','❤️']},
      r:{t:'Hal-hal Kecil 🌷', body:['"Tau nggak sih? Kadang hal paling sederhana kayak dapet chat dari kamu atau ngobrol random bareng bisa bikin mood aku langsung bagus seharian.','Kayak kucing di sampul depan, walau cuma bawa bunga kecil tapi udah bikin senyum sendiri hehe."'], deco:['✨','🧸','✨'], hint:'Sentuh buat balik →'}
    },
    {
      l:{t:'Sumpah Ya... 😚', body:['"Jujurly, makin hari rasanya makin sayang (aelah wkwk). Tapi beneran kok! Kamu tuh kayak rumah tempat pulang pas lagi capek.','Tetap jadi orang yang asik dan gemesin begini ya. Jangan ke mana-mana!"'], deco:['💕','☕','🍩']},
      r:{t:'Janji Asli 🤞', body:['"Walaupun kita kadang suka ribut sepele (kayak mau makan di mana), ujungnya tetap ketawa lagi kan?','Intinya, aku bakal terus nemenin kamu di saat senang maupun mager bareng. Eits, dikit lagi halaman terakhir!"'], deco:['🎉','🎀','🎊'], hint:'Halaman terakhir →'}
    },
    {
      l:{t:'The End 😛', body:['"Udah habis catatannya! Makasih ya udah baca sampai akhir.','<span class="strong">Semoga hari kamu semanis permen karet pink dan secerah senyum kucing gigit bunga! Love you! 🐾💕</span>"'], deco:['❤️','🐱','💐','😻']},
      r:{back:true, t:'Selesai Ya! 🎀', sub:'Sampai jumpa di cerita berikutnya~', close:'Tutup Buku 📖'}
    }
  ];

  const $ = id => document.getElementById(id);
  // foto: coba pakai blob URL, kalau gagal pakai data URI langsung
  function toURL(d){
    try{
      const bin = atob(d.split(',')[1]), u = new Uint8Array(bin.length);
      for(let k=0;k<bin.length;k++) u[k] = bin.charCodeAt(k);
      return URL.createObjectURL(new Blob([u],{type:'image/jpeg'}));
    }catch(err){ return d; }
  }
  const photoURLs = photos.map(toURL);
  const backURL = toURL(backPhoto);
  function imgTag(url, data){
    return `<img alt="" src="${url}" onerror="if(this.src!=='${data}'){this.src='${data}'}">`;
  }
  const cover = $('cover'), book = $('book'), pl = $('pl'), pr = $('pr');
  const mq = window.matchMedia('(max-width:640px)');
  const flat = spreads.flatMap(s => [s.l, s.r]);
  const corners = ['🐾','🌷','🍓','🎀','⭐','🐱'];
  const marks   = ['🐱','🌸','🍓','🎀','🎉','💖'];
  let i = 0;   // index spread (laptop)
  let n = 0;   // index halaman (HP)

  function side(el, d, idx, mobile){
    el.classList.toggle('back', !!d.back);
    const pi = idx%photos.length;
    const bg = d.back
      ? `<div class="bg">${imgTag(backURL, backPhoto)}</div>`
      : `<div class="bg">${imgTag(photoURLs[pi], photos[pi])}</div>`;
    const deco = bg + `<span class="corner">${corners[idx%corners.length]}</span>
      <span class="wm">${marks[idx%marks.length]}</span>
      <span class="sparkle" style="top:${18+(idx*13)%30}%;left:${8+(idx*23)%20}%">✨</span>
      <span class="sparkle" style="top:${55+(idx*9)%25}%;right:${6+(idx*17)%14}%;animation-delay:1s">💗</span>`;
    if(d.back){
      el.innerHTML = `${deco}<h2>${d.t}</h2><div class="sub">${d.sub}</div><div class="close">${d.close}</div>`;
      return;
    }
    const hint = d.hint || (mobile ? 'Sentuh / geser buat lanjut →' : '');
    el.innerHTML = `${deco}<h2>${d.t}</h2>
      <div class="txt">${d.body.map(p=>`<p>${p}</p>`).join('')}</div>
      ${hint?`<div class="hint">${hint}</div>`:''}`;
  }
  function render(noFlip){
    if(mq.matches){
      side(pl, flat[n], n, true);
    } else {
      side(pl, spreads[i].l, i*2);
      side(pr, spreads[i].r, i*2+1);
    }
    if(!noFlip){ book.classList.remove('flip'); void book.offsetWidth; book.classList.add('flip'); }
  }
  function pop(e){
    if(!e || e.clientX===undefined) return;
    const s = document.createElement('div');
    s.className='pop'; s.textContent=['💖','✨','🐾','🌸'][Math.floor(Math.random()*4)];
    s.style.left=e.clientX+'px'; s.style.top=e.clientY+'px';
    document.body.appendChild(s); setTimeout(()=>s.remove(),1200);
  }
  function openBook(){
    cover.style.display='none'; book.classList.add('show');
    i=0; n=0; render();
  }
  function closeBook(){
    book.classList.remove('show'); cover.style.display='flex';
  }
  // animasi halaman dibalik (ke halaman berikutnya)
  function turnLeaf(){
    const mobile = mq.matches;
    const mk = (src, cls) => {
      const c = src.cloneNode(true);
      c.removeAttribute('id'); c.classList.add(cls);
      book.appendChild(c);
      setTimeout(() => c.remove(), 900);
      return c;
    };
    if(!mobile) mk(pl, 'leaf-static');
    mk(mobile ? pl : pr, 'leaf');
  }
  function go(dir){
    if(mq.matches){
      const t = n+dir;
      if(t<0 || t>=flat.length) return closeBook();
      if(dir>0) turnLeaf();
      n = t;
    } else {
      const t = i+dir;
      if(t<0 || t>=spreads.length) return closeBook();
      if(dir>0) turnLeaf();
      i = t;
    }
    render(dir>0);
  }

  cover.onclick = e => { pop(e); openBook(); };
  book.onclick = e => {
    if(swiped){ swiped=false; return; }
    pop(e); go(1);
  };

  // geser kiri/kanan
  let sx = 0, sy = 0, swiped = false;
  book.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; swiped=false; }, {passive:true});
  book.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if(Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)){ swiped = true; go(dx<0 ? 1 : -1); }
  });
  // keyboard (laptop)
  document.addEventListener('keydown', e => {
    if(!book.classList.contains('show')) return;
    if(e.key==='ArrowRight') go(1);
    if(e.key==='ArrowLeft') go(-1);
  });
  // kalau layar berubah (rotate HP), sinkronin halaman
  mq.addEventListener('change', () => {
    if(!book.classList.contains('show')) return;
    if(mq.matches) n = i*2; else i = Math.floor(n/2);
    render();
  });
</script>
